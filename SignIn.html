<html>
    <head>
        <style>
             @import url('https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap');

            body{
                margin: 0px;
                padding: 0px;
                height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                font-family: "Mulish", sans-serif;
                font-optical-sizing: auto;
                font-style: normal;
                
            }

            .outerframe{
                border: solid 1px;
                width: 380px;
                height: 445px;
                padding: 20px;
                box-shadow: 5px 5px 5px;
                border-radius: 10px;
                display: flex;
                flex-direction: column;
                                 
            }

            
            #email,#password{
                border: solid 1px #dedede;
                border-radius: 5px;
                height: 45px;
                width: 380px;
                font-size: 18px;               
            }

            .input{
                margin-top: 30px;
            }
            
            
            #welcome{
                font-size: 14px;
                color:#757575
            }

            #Sign{
                font-size: 24px;
                font-weight: bolder;
                color:#333333
           
            }

            #ForgetPass{
                font-size: 16px;
                text-decoration: none;
            }
            #NoAcc{
                font-size: 12px;
            }

            #button{
                background: linear-gradient(90deg, rgba(98,91,247,1) 0%, rgba(70,62,234,1) 100%);
                color: white;
                font-size: 20px;
                width: 380px;
                height: 45px;
                border-radius: 5px;
                
            }

        </style>
    </head>

    <body>
        <div class="outerframe">

            <p id="Welcome">Welcome back 👋</p>
            <p id="Sign">Sign in to your account</p>

            <div class="input">
                <label for="email">Your email</label>
                <input type="text" id="email">
            </div>

            <div class="input">
                <label for="password">Password</label>
                <input type="password" id="password">
            </div>

            <div class="input"> 
                <input type="button" id="button" value="CONTINIUE">
            </div>

            <a id="ForgetPass" href="">Forget your password?</a>
        </div>

        <p id="NoAcc">Don't have an account? <a href="">Sign up</a></p>
</html>
